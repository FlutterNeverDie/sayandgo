<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="테이블에 QR 하나로 손님의 익명 질문과 의견을 받는 매장 질문함" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <!-- 필요한 글자만 받는 동적 서브셋 (전송량 절감) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 앱 파일을 못 불러오면(배포 직후 옛 화면 등) 1분에 한 번만 새로고침
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
        try {
          var last = Number(sessionStorage.getItem('sayandgo:bootReload') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('sayandgo:bootReload', String(Date.now()));
        } catch (_) {}
        location.reload();
      }, true);
    </script>
    <title>Say&amp;Go</title>
  </head>
  <body>
    <div id="root">
      <!-- 앱이 뜨기 전에도 흰 화면 대신 로고가 보이게 (React가 그리면 사라진다) -->
      <div style="min-height:100vh;display:grid;place-items:center;background:#f2f4f3">
        <svg width="56" height="56" viewBox="0 0 100 100" aria-label="Say&amp;Go"><rect width="100" height="100" rx="24" fill="#3ccfae"/><path d="M30 24h40a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H44l-14 12v-12a12 12 0 0 1-12-12V36a12 12 0 0 1 12-12Z" fill="#15201d"/><path d="M44 37l11 10-11 10" fill="none" stroke="#3ccfae" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
